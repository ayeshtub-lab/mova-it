<!doctype html>
<!-- Shown by public/sw.js when a page can't load for lack of a connection (kept on the phone,
     so it opens with none). It reloads by itself once the connection is back. -->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10163a" />
    <title>زاومو — ما في اتصال</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        padding: 24px; background: #10163a; color: #fffbf0; text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      }
      main { max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
      img { width: 88px; height: 88px; border-radius: 24px; }
      h1 { margin: 6px 0 0; font-size: 24px; }
      p { margin: 0; line-height: 1.7; color: #fbe2d8; }
      button {
        margin-top: 8px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px;
        background: #e63946; color: #fff; font: inherit; font-weight: 800; font-size: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="زاومو" />
      <h1>📡 ما في اتصال</h1>
      <p>لحظاتك بخير وبتستناك. أول ما يرجع الإنترنت بيرجع زاومو لحاله.</p>
      <button type="button" onclick="location.reload()">جرّب مرة ثانية</button>
    </main>
    <script>
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
